    - esbuild
    - workerd

overrides:
    'vitepress>vite': '6.4.3'
    'miniflare>sharp': '0.35.5'
    'undici@^7': '7.29.1'
    'brace-expansion@^1': '1.1.21'
    'brace-expansion@^2': '2.1.7'
    'brace-expansion@^4': '5.0.12'
    'brace-expansion@^5': '5.0.12'
    'source-map-js@^1': '1.2.2'

patchedDependencies:
    braces@3.0.3: patches/braces@3.0.3.patch

# braces has no published fix; the checked patch bounds all recursive AST walkers.
# security:audit verifies the installed patch before accepting this one advisory.
auditConfig:
    ignoreGhsas:
        - GHSA-vfj7-8cjw-p6xm
